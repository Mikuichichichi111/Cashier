<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nano Town - Hub</title>
    <script src="nano-core.js"></script>
    <style>
        body { font-family: sans-serif; background: #f8f9fa; margin: 0; }
        .header { background: #6a5acd; color: white; padding: 20px; text-align: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 25px; }
        .module { text-align: center; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); cursor: pointer; }
        .module img { width: 80px; height: 80px; object-fit: contain; margin-bottom: 10px; }
        .module p { margin: 0; font-weight: bold; color: #333; }
        .wallet-info { font-size: 14px; margin-top: 5px; opacity: 0.9; }
    </style>
</head>
<body>
    <div class="header">
        <h2 id="welcome" style="margin:0;">Chargement...</h2>
        <div class="wallet-info" id="wallet">💰 ... Nano</div>
    </div>
    
    <div class="grid" id="menu"></div>

    <script>
        // Vérification de connexion
        if(!Nano.user) window.location.href = 'index.html';
        
        document.getElementById('welcome').innerText = `🏙️ ${Nano.user.ville_name}`;
        document.getElementById('wallet').innerText = `👤 ${Nano.user.username} | 💰 ${Nano.user.argent} Nano`;
        
        async function displayMenu() {
            // On charge les modules dynamiquement depuis Supabase
            const url = `${SUPABASE_URL}/rest/v1/modules`;
            const response = await fetch(url, {
                headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
            });
            const modules = await response.json();
            
            const menu = document.getElementById('menu');
            menu.innerHTML = modules.map(m => `
                <div class="module" onclick="window.location.href='${m.fichier}'">
                    <img src="${m.icone_url}">
                    <p>${m.nom}</p>
                </div>
            `).join('');
        }
        displayMenu();
    </script>
</body>
</html>
