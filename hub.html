<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Hub</title><script src="nano-core.js"></script></head>
<body>
    <h2>Bienvenue <span id="name"></span></h2>
    <div id="m"></div>
    <script>
        document.getElementById('name').innerText = Nano.user.username;
        fetch(`${SUPABASE_URL}/rest/v1/modules`, {headers:{"apikey":SUPABASE_KEY}})
        .then(r=>r.json()).then(d => {
            document.getElementById('m').innerHTML = d.map(m => 
                `<p><a href="${m.fichier}">${m.nom}</a></p>`).join('');
        });
    </script>
</body>
</html>
