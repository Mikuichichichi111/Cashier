<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Caisse - Scanner Code-Barres</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f7f6; padding: 20px; }
        #reader { width: 100%; max-width: 450px; margin: auto; border-radius: 15px; overflow: hidden; }
        .list { background: white; padding: 15px; border-radius: 15px; margin-top: 20px; text-align: left; }
    </style>
</head>
<body>
    <h1>🛒 Caisse Enregistreuse</h1>
    <div id="reader"></div>

    <div class="list">
        <h3>Panier actuel :</h3>
        <ul id="items"></ul>
        <hr>
        <strong>Total : <span id="total">0</span> Nano</strong>
    </div>

<script>
    const URL = "https://mitepoyvwxfrffwqgyxb.supabase.co/rest/v1";
    const KEY = "Sb_publishable_uCSvxjc-yJIULaaAMJcNpg_J2zwiect";
    let totalCaisse = 0;

    const barScanner = new Html5Qrcode("reader");
    // On supporte les formats de codes-barres classiques
    barScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: {width: 300, height: 150} }, 
    async (code) => {
        const res = await fetch(`${URL}/produits?code_barre=eq.${code}`, { headers: { "apikey": KEY } });
        const items = await res.json();
        if(items[0]) {
            totalCaisse += items[0].prix;
            document.getElementById('total').innerText = totalCaisse;
            const li = document.createElement('li');
            li.innerText = `${items[0].nom} - ${items[0].prix} N`;
            document.getElementById('items').appendChild(li);
        }
    });
</script>
</body>
</html>
