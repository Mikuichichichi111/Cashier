<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caisse Auto-Apprenante</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        :root { --primary: #6a5acd; --bg: #f0f2f5; --card: #ffffff; --accent: #2ecc71; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        .container { max-width: 800px; margin: auto; }
        
        /* Grille de produits */
        .grid-produits { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); 
            gap: 10px; margin-top: 15px; 
        }
        .item-bouton { 
            background: white; border-radius: 12px; padding: 10px; text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; border: 2px solid transparent;
        }
        .item-bouton img { width: 100%; height: 80px; object-fit: cover; border-radius: 8px; background: #eee; }
        .item-bouton span { display: block; font-weight: bold; margin-top: 5px; font-size: 0.8rem; }

        .section { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 15px; }
        button { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; width: 100%; margin: 5px 0; font-size: 1rem; }
        
        /* Scanner & Preview Photo */
        #video-container { display: none; width: 100%; background: #000; border-radius: 15px; overflow: hidden; position: relative; }
        video { width: 100%; display: block; }
        
        /* Modal Nouveau Produit */
        #modal-new { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 20px; border-radius: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.3);
            width: 90%; max-width: 400px; z-index: 100;
        }
        .overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index: 99; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        
        .receipt { background: #fffbe6; border: 2px dashed #000; padding: 20px; font-family: monospace; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="section">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h1 style="font-size:1.2rem; margin:0;">🛒 MA CAISSE RAPIDE</h1>
            <span style="font-weight:bold; color:var(--accent);">💳 <span id="balanceDisplay">0</span> DH</span>
        </div>
        <button id="mainBtn" onclick="startScan()" style="background:var(--accent);">📷 SCANNER UN PRODUIT</button>
        <button class="btn-exit" onclick="endSession()" style="background:#e74c3c;">FINIR LA VENTE (TICKET)</button>
    </div>

    <div id="video-container">
        <video id="video"></video>
        <button onclick="stopScan()" style="background:rgba(231, 76, 60, 0.8); position:absolute; bottom:10px; width:80%; left:10%;">Annuler</button>
    </div>

    <div class="section">
        <select id="paymentMethod" style="width:100%; padding:10px; border-radius:8px;">
            <option value="especes">Paiement : Espèces 💵</option>
            <option value="carte">Paiement : Carte Magique 💳</option>
        </select>
        <div id="gridProduits" class="grid-produits"></div>
    </div>

    <div id="receiptArea" class="section receipt">
        <h3 style="text-align:center;">TICKET DE VENTE</h3>
        <div id="receiptItems"></div>
        <hr>
        <p><strong>TOTAL : <span id="receiptTotal">0</span> DH</strong></p>
        <button onclick="location.reload()" style="background:#333;">NOUVELLE SESSION</button>
    </div>
</div>

<div class="overlay" id="overlay"></div>
<div id="modal-new">
    <h2 style="margin-top:0; color:var(--primary);">✨ Nouveau Produit !</h2>
    <p style="font-size:0.8rem; color:grey;">Code détecté : <span id="newCodeDisplay"></span></p>
    
    <input type="text" id="newName" placeholder="Nom de l'objet (ex: Chips)">
    <input type="number" id="newPrice" placeholder="Prix (ex: 15)">
    
    <p style="font-size:0.8rem;">Prendre en photo :</p>
    <input type="file" id="newFile" accept="image/*" capture="camera" style="border:none;">

    <button onclick="saveNewProduct()">ENREGISTRER ET AJOUTER</button>
</div>

<script>
    let wallet = parseFloat(localStorage.getItem('wallet')) || 500;
    let products = JSON.parse(localStorage.getItem('products')) || [];
    let currentSession = [];
    let tempCode = "";
    const codeReader = new ZXing.BrowserMultiFormatReader();

    function updateUI() {
        document.getElementById('balanceDisplay').innerText = wallet.toFixed(2);
        const grid = document.getElementById('gridProduits');
        grid.innerHTML = '';
        products.forEach(p => {
            grid.innerHTML += `
                <div class="item-bouton" onclick="sellItem('${p.code}')">
                    <img src="${p.img || ''}">
                    <span>${p.name}</span>
                    <small>${p.price} DH</small>
                </div>`;
        });
        localStorage.setItem('wallet', wallet);
        localStorage.setItem('products', JSON.stringify(products));
    }

    function startScan() {
        document.getElementById('video-container').style.display = 'block';
        codeReader.decodeFromVideoDevice(null, 'video', (result, err) => {
            if (result) {
                stopScan();
                handleScannedCode(result.text);
            }
        });
    }

    function stopScan() {
        codeReader.reset();
        document.getElementById('video-container').style.display = 'none';
    }

    function handleScannedCode(code) {
        const item = products.find(p => p.code === code);
        if (item) {
            sellItem(code);
        } else {
            // C'est un nouveau produit !
            tempCode = code;
            document.getElementById('newCodeDisplay').innerText = code;
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('modal-new').style.display = 'block';
        }
    }

    function saveNewProduct() {
        const name = document.getElementById('newName').value || "Produit Inconnu";
        const price = parseFloat(document.getElementById('newPrice').value) || 0;
        const fileInput = document.getElementById('newFile');
        
        let imgBase64 = "";
        
        if (fileInput.files && fileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                imgBase64 = e.target.result;
                finalizeProduct(name, price, imgBase64);
            }
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            finalizeProduct(name, price, "");
        }
    }

    function finalizeProduct(name, price, img) {
        products.push({ name, price, code: tempCode, img });
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('modal-new').style.display = 'none';
        
        // On réinitialise le formulaire
        document.getElementById('newName').value = "";
        document.getElementById('newPrice').value = "";
        
        updateUI();
        sellItem(tempCode); // On l'ajoute direct à la vente
    }

    function sellItem(code) {
        const item = products.find(p => p.code === code);
        const method = document.getElementById('paymentMethod').value;
        if(item) {
            if(method === 'carte' && wallet < item.price) {
                alert("Fond insuffisants !"); return;
            }
            if(method === 'carte') wallet -= item.price;
            currentSession.push(item);
            // Petit son de bip (optionnel)
            const audio = new Audio('https://www.soundjay.com/buttons/beep-07a.mp3');
            audio.play();
            updateUI();
        }
    }

    function endSession() {
        if(currentSession.length === 0) return alert("Rien n'a été vendu !");
        document.getElementById('receiptItems').innerHTML = '';
        let total = 0;
        currentSession.forEach(item => {
            total += item.price;
            document.getElementById('receiptItems').innerHTML += `<div style="display:flex; justify-content:space-between;"><span>${item.name}</span><span>${item.price} DH</span></div>`;
        });
        document.getElementById('receiptTotal').innerText = total.toFixed(2);
        document.getElementById('receiptArea').style.display = 'block';
    }

    updateUI();
</script>
</body>
</html>
