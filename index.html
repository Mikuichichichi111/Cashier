<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nano Town - Login</title>
    <script src="nano-core.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; padding-top: 80px; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 25px; display: inline-block; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 280px; }
        h1 { color: #6a5acd; margin-bottom: 20px; }
        input { display: block; width: 100%; padding: 12px; margin: 15px 0; border-radius: 12px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; }
        button { background: #6a5acd; color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="box">
        <h1>🏙️ Nano Town</h1>
        <input type="text" id="user" placeholder="Ton Pseudo">
        <input type="text" id="ville" placeholder="Nom de la Ville">
        <button onclick="Nano.login(document.getElementById('user').value, document.getElementById('ville').value)">REJOINDRE</button>
    </div>
</body>
</html>
