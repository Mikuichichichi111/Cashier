<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nano Caisse</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        :root { --primary: #6a5acd; --bg: #f0f2f5; --accent: #2ecc71; --danger: #ff7675; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; display: flex; height: 100vh; }
        .left-panel { flex: 1; padding: 15px; overflow-y: auto; }
        .right-panel { width: 320px; background: white; padding: 15px; display: flex; flex-direction: column; border-left: 2px solid #ddd; }
        .grid-produits { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
        .item-bouton { background: white; border-radius: 12px; padding: 8px; text-align: center; border: 1px solid #ddd; position: relative; }
        .item-bouton img { width: 100%; height: 60px; object-fit: cover; border-radius: 8px; }
        .cart-list { flex: 1; overflow-y: auto; margin: 10px 0; border: 1px solid #eee; border-radius: 8px; }
        .cart-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #eee; font-size: 14px; }
        .total-box { font-size: 1.5rem; font-weight: bold; text-align: center; padding: 15px; background: #eef; border-radius: 10px; }
        button { padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 5px; }
        .btn-scan { background: var(--primary); color: white; }
        .btn-pay { background: var(--accent); color: white; }
        .overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index: 1000; }
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 15px; z-index: 1001; width: 85%; max-width: 350px; }
        #video-container { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:black; z-index: 2000; }
        video { width: 100%; height: 80%; object-fit: cover; }
    </style>
</head>
<body>

    <div class="left-panel">
        <div style="display:flex; justify-content:space-between;">
            <h2>Magasin</h2>
            <button onclick="toggleEdit()" id="editBtn" style="width:auto; padding:5px 10px;">⚙️ Modifier</button>
        </div>
        <div id="gridProduits" class="grid-produits"></div>
    </div>

    <div class="right-panel">
        <h3>🛒 Panier</h3>
        <button class="btn-scan" onclick="startScan()">📷 SCANNER PRODUIT</button>
        <div id="cartDisplay" class="cart-list"></div>
        <div class="total-box"><span id="totalPrice">0</span> N</div>
        <button class="btn-pay" onclick="showModal('modal-pay')">ENCAISSER</button>
        <a href="wallet.html" style="text-align:center; display:block; margin-top:10px; color:var(--primary);">Ouvrir Wallet ➔</a>
    </div>

    <div class="overlay" id="overlay" onclick="closeAll()"></div>

    <!-- Modal Nouveau Produit -->
    <div id="modal-new" class="modal">
        <h3>Nouveau Produit</h3>
        <input type="text" id="newName" placeholder="Nom" style="width:90%; padding:10px; margin-bottom:10px;">
        <input type="number" id="newPrice" placeholder="Prix" style="width:90%; padding:10px; margin-bottom:10px;">
        <button class="btn-pay" onclick="saveProduct()">ENREGISTRER</button>
    </div>

    <!-- Modal Paiement -->
    <div id="modal-pay" class="modal">
        <h3>Payer</h3>
        <select id="payMode" style="width:100%; padding:10px;">
            <option value="especes">Espèces 💵</option>
            <option value="carte">Carte Wallet 💳</option>
        </select>
        <button class="btn-pay" onclick="finishPayment()" style="margin-top:15px;">VALIDER</button>
    </div>

    <div id="video-container">
        <video id="video"></video>
        <button onclick="stopScan()" style="background:red; color:white; height:20%; width:100%;">ANNULER</button>
    </div>

<script>
    const URL = "https://mitepoyvwxfrffwqgyxb.supabase.co/rest/v1";
    const KEY = "Sb_publishable_uCSvxjc-yJIULaaAMJcNpg_J2zwiect";
    
    let products = [];
    let cart = [];
    let isEditing = false;
    let currentCode = "";
    const reader = new ZXing.BrowserMultiFormatReader();

    async function loadData() {
        const res = await fetch(`${URL}/produits`, { headers: { "apikey": KEY } });
        products = await res.json();
        render();
    }

    function render() {
        const grid = document.getElementById('gridProduits');
        grid.innerHTML = products.map((p, i) => `
            <div class="item-bouton" onclick="${isEditing ? `deleteProduct('${p.id}')` : `addToCart('${p.code}')`}">
                <div style="font-weight:bold;">${p.name}</div>
                <div>${p.price} N</div>
                ${isEditing ? '<div style="color:red;">Supprimer</div>' : ''}
            </div>
        `).join('');

        const cartDiv = document.getElementById('cartDisplay');
        cartDiv.innerHTML = cart.map((item, i) => `
            <div class="cart-item"><span>${item.name}</span><span>${item.price} N</span></div>
        `).join('');

        const total = cart.reduce((s, i) => s + i.price, 0);
        document.getElementById('totalPrice').innerText = total;
    }

    function addToCart(code) {
        const p = products.find(x => x.code === code);
        if(p) { cart.push(p); render(); }
    }

    function startScan() {
        document.getElementById('video-container').style.display = 'block';
        reader.decodeFromVideoDevice(null, 'video', (res) => {
            if(res) {
                stopScan();
                const p = products.find(x => x.code === res.text);
                if(p) addToCart(res.text);
                else { currentCode = res.text; showModal('modal-new'); }
            }
        });
    }

    function stopScan() { reader.reset(); document.getElementById('video-container').style.display = 'none'; }

    async function saveProduct() {
        const name = document.getElementById('newName').value;
        const price = parseFloat(document.getElementById('newPrice').value);
        await fetch(`${URL}/produits`, {
            method: 'POST',
            headers: { "apikey": KEY, "Content-Type": "application/json" },
            body: JSON.stringify({ name, price, code: currentCode })
        });
        closeAll(); loadData();
    }

    async function finishPayment() {
        const total = cart.reduce((s, i) => s + i.price, 0);
        const mode = document.getElementById('payMode').value;
        
        if(mode === 'carte') {
            const res = await fetch(`${URL}/cards?name=eq.Noah`, { headers: { "apikey": KEY } });
            const card = (await res.json())[0];
            if(card.balance < total) return alert("Solde insuffisant !");
            
            await fetch(`${URL}/cards?name=eq.Noah`, {
                method: 'PATCH',
                headers: { "apikey": KEY, "Content-Type": "application/json" },
                body: JSON.stringify({ balance: card.balance - total })
            });
        }
        alert("Paiement validé !");
        cart = []; closeAll(); render();
    }

    function showModal(id) { document.getElementById('overlay').style.display = 'block'; document.getElementById(id).style.display = 'block'; }
    function closeAll() { document.querySelectorAll('.modal, .overlay').forEach(m => m.style.display = 'none'); }
    function toggleEdit() { isEditing = !isEditing; render(); }

    loadData();
</script>
</body>
</html>
