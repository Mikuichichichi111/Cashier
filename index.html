<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nano Caisse Pro</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        :root { --p: #6a5acd; --bg: #f0f2f5; --ok: #2ecc71; }
        body { 
            font-family: sans-serif; 
            background: var(--bg); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
        }
        /* Mode iPad Paysage / Ordi */
        @media (min-width: 768px) {
            body { flex-direction: row; height: 100vh; overflow: hidden; }
            .left { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
            .right { width: 320px; border-left: 2px solid #ddd; height: 100vh; }
        }
        .left { padding: 15px; flex: 1; }
        .right { background: white; padding: 15px; display: flex; flex-direction: column; border-top: 2px solid #ddd; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding-bottom: 30px; }
        .item { background: white; border-radius: 12px; padding: 15px; text-align: center; border: 1px solid #ddd; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .cart-list { flex: 1; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; margin: 10px 0; min-height: 100px; }
        .total-box { font-size: 1.8rem; font-weight: bold; text-align: center; padding: 15px; background: #eef; border-radius: 10px; margin-bottom: 10px; }
        
        button { padding: 15px; border-radius: 12px; border: none; font-weight: bold; width: 100%; margin-bottom: 8px; font-size: 16px; cursor: pointer; }
        .btn-scan { background: var(--p); color: white; }
        .btn-pay { background: var(--ok); color: white; }
        
        .overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index: 1000; }
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 15px; z-index: 1001; width: 85%; max-width: 300px; }
        
        #v-cont { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:black; z-index: 2000; }
        video { width: 100%; height: 80%; object-fit: cover; }
    </style>
</head>
<body>

    <div class="left">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h2 style="margin:0;">🛒 Magasin</h2>
            <button onclick="isE=!isE;load()" style="width:auto; padding:8px 15px; background:#636e72; color:white; margin:0;">⚙️ Gérer</button>
        </div>
        <div id="gP" class="grid"></div>
    </div>

    <div class="right">
        <h3>Panier</h3>
        <button class="btn-scan" onclick="startS()">📷 SCANNER PRODUIT</button>
        <div id="cDisp" class="cart-list"></div>
        <div class="total-box"><span id="tP">0</span> N</div>
        <button class="btn-pay" onclick="showM('m-pay')">ENCAISSER</button>
        <button onclick="cart=[];ren()" style="background:#f1f2f6; color:#2f3542;">VIDER</button>
    </div>

    <div class="overlay" id="ov" onclick="closeM()"></div>

    <div id="m-new" class="modal">
        <h3>Nouvel Article</h3>
        <p id="scannedCode" style="font-size:12px; color:gray;"></p>
        <input type="text" id="nN" placeholder="Nom du produit" style="width:90%; padding:12px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px;">
        <input type="number" id="nP" placeholder="Prix en Nano" style="width:90%; padding:12px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px;">
        <button class="btn-pay" onclick="saveP()">ENREGISTRER</button>
    </div>

    <div id="m-pay" class="modal">
        <h3>Paiement</h3>
        <button onclick="finishP('cash')" style="background:#2ecc71; color:white; margin-bottom:15px;">ESPECES 💵</button>
        <button onclick="finishP('card')" style="background:#6a5acd; color:white;">WALLET NOAH 💳</button>
    </div>

    <div id="v-cont">
        <video id="video"></video>
        <button onclick="stopS()" style="background:red; color:white; height:20%; width:100%; font-size:20px;">ANNULER LE SCAN</button>
    </div>

<script>
    const U = "https://mitepoyvwxfrffwqgyxb.supabase.co/rest/v1";
    const K = "Sb_publishable_uCSvxjc-yJIULaaAMJcNpg_J2zwiect";
    const H = { "apikey": K, "Content-Type": "application/json" };
    
    let prods = [], cart = [], isE = false, curC = "";
    const rd = new ZXing.BrowserMultiFormatReader();

    async function load() {
        const r = await fetch(`${U}/produits`, { headers: H });
        prods = await r.json();
        ren();
    }

    function ren() {
        document.getElementById('gP').innerHTML = prods.map(p => `
            <div class="item" onclick="${isE ? `delP('${p.id}')` : `addC('${p.code}')`}">
                <strong>${p.name}</strong><br><span style="color:var(--p)">${p.price} N</span>
                ${isE ? '<br><small style="color:red; font-weight:bold;">Supprimer</small>' : ''}
            </div>`).join('');
        document.getElementById('cDisp').innerHTML = cart.map(i => `<div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid #eee; font-size:14px;"><span>${i.name}</span><span>${i.price} N</span></div>`).join('');
        document.getElementById('tP').innerText = cart.reduce((s, i) => s + i.price, 0);
    }

    function addC(c) { const p = prods.find(x => x.code === c); if(p) { cart.push(p); ren(); } }

    function startS() {
        document.getElementById('v-cont').style.display = 'block';
        rd.decodeFromVideoDevice(null, 'video', (res) => {
            if(res) {
                stopS();
                const p = prods.find(x => x.code === res.text);
                if(p) {
                    addC(res.text);
                } else {
                    curC = res.text;
                    document.getElementById('scannedCode').innerText = "Code : " + curC;
                    showM('m-new');
                }
            }
        });
    }
    function stopS() { rd.reset(); document.getElementById('v-cont').style.display = 'none'; }

    async function saveP() {
        const name = document.getElementById('nN').value, price = parseFloat(document.getElementById('nP').value);
        if(!name || isNaN(price)) return alert("Détails invalides !");
        await fetch(`${U}/produits`, { method: 'POST', headers: H, body: JSON.stringify({ name, price, code: curC }) });
        document.getElementById('nN').value = ""; document.getElementById('nP').value = "";
        closeM(); load();
    }

    async function delP(id) {
        if(confirm("Supprimer cet article ?")) {
            await fetch(`${U}/produits?id=eq.${id}`, { method: 'DELETE', headers: H });
            load();
        }
    }

    async function finishP(m) {
        const total = cart.reduce((s, i) => s + i.price, 0);
        if(total === 0) return alert("Panier vide !");
        if(m === 'card') {
            const r = await fetch(`${U}/cards?name=eq.Noah`, { headers: H });
            const c = (await r.json())[0];
            if(c.balance < total) return alert("Solde insuffisant !");
            await fetch(`${U}/cards?name=eq.Noah`, { method: 'PATCH', headers: H, body: JSON.stringify({ balance: c.balance - total }) });
        }
        alert("Paiement validé !"); cart = []; closeM(); ren();
    }

    function showM(id) { document.getElementById('ov').style.display = 'block'; document.getElementById(id).style.display = 'block'; }
    function closeM() { document.querySelectorAll('.modal, .overlay').forEach(m => m.style.display = 'none'); }
    load();
</script>
</body>
</html>
