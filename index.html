<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Nano Caisse Duo</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; padding: 15px; }
        #reader { width: 100%; max-width: 400px; margin: auto; border-radius: 20px; overflow: hidden; }
        .card { background: white; padding: 20px; border-radius: 20px; margin-top: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .price { font-size: 32px; font-weight: bold; color: #2ecc71; margin: 10px 0; }
        button { width: 100%; padding: 15px; background: #2ecc71; color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; }
        .nav { margin-top: 15px; display: block; color: #6a5acd; text-decoration: none; }
    </style>
</head>
<body>
    <h2>🛒 Scanner Caisse</h2>
    <div id="reader"></div>

    <div class="card">
        <div id="item-name">Prêt à scanner...</div>
        <div class="price"><span id="item-price">0</span> N</div>
        <button onclick="payer()">VALIDER L'ACHAT</button>
        <a href="wallet.html" class="nav">Voir le Wallet Commun ➔</a>
    </div>

<script>
    const URL = "https://mitepoyvwxfrffwqgyxb.supabase.co/rest/v1";
    const KEY = "Sb_publishable_uCSvxjc-yJIULaaAMJcNpg_J2zwiect";
    let pActuel = 0;

    const scanner = new Html5Qrcode("reader");
    scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, async (code) => {
        const res = await fetch(`${URL}/produits?code_barre=eq.${code}`, { headers: { "apikey": KEY } });
        const items = await res.json();
        if (items.length > 0) {
            pActuel = items[0].prix;
            document.getElementById('item-name').innerText = items[0].nom;
            document.getElementById('item-price').innerText = pActuel;
        }
    });

    async function payer() {
        if (pActuel <= 0) return;
        const resSolde = await fetch(`${URL}/wallet_commun?id=eq.1`, { headers: { "apikey": KEY } });
        const data = await resSolde.json();
        const nouveauSolde = data[0].solde - pActuel;

        await fetch(`${URL}/wallet_commun?id=eq.1`, {
            method: 'PATCH',
            headers: { "apikey": KEY, "Content-Type": "application/json" },
            body: JSON.stringify({ solde: nouveauSolde })
        });
        alert("Paiement effectué !");
        location.reload();
    }
</script>
</body>
</html>
