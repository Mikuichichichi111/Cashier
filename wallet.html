<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Wallet</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body { font-family: sans-serif; background: #6a5acd; color: white; text-align: center; padding: 20px; margin: 0; }
        .card { background: rgba(255,255,255,0.2); padding: 30px; border-radius: 25px; border: 2px solid white; margin-top: 50px; }
        .balance { font-size: 3rem; font-weight: bold; margin: 20px 0; }
        button { background: white; color: #6a5acd; border: none; padding: 15px 30px; border-radius: 15px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        #video-container { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:black; }
        video { width: 100%; height: 80%; object-fit: cover; }
    </style>
</head>
<body>

    <div class="card">
        <h2>SOLDE NANO</h2>
        <div class="balance"><span id="solde">...</span> N</div>
        <button onclick="startScan()">📷 SCANNER QR PAIEMENT</button>
    </div>

    <div id="video-container">
        <video id="video"></video>
        <button onclick="stopScan()" style="background:red; color:white; width:100%; height:20%;">FERMER</button>
    </div>

<script>
    const URL = "https://mitepoyvwxfrffwqgyxb.supabase.co/rest/v1";
    const KEY = "Sb_publishable_uCSvxjc-yJIULaaAMJcNpg_J2zwiect";
    const reader = new ZXing.BrowserMultiFormatReader();

    async function updateSolde() {
        const res = await fetch(`${URL}/cards?name=eq.Noah`, { headers: { "apikey": KEY } });
        const data = await res.json();
        if(data[0]) document.getElementById('solde').innerText = data[0].balance;
    }

    function startScan() {
        document.getElementById('video-container').style.display = 'block';
        reader.decodeFromVideoDevice(null, 'video', async (res) => {
            if(res) {
                stopScan();
                // Ici, on imagine que le QR contient le montant à payer
                const montant = parseFloat(res.text);
                alert("Vous allez payer " + montant + " N");
                // Logique de paiement...
            }
        });
    }

    function stopScan() { reader.reset(); document.getElementById('video-container').style.display = 'none'; }

    updateSolde();
    setInterval(updateSolde, 3000); // Sync auto toutes les 3s
</script>
</body>
</html>
