<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noah Wallet</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body { 
            font-family: sans-serif; 
            background: #6a5acd; 
            color: white; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .box { 
            background: rgba(255,255,255,0.1); 
            border: 2px solid white; 
            padding: 40px 20px; 
            border-radius: 30px; 
            margin-top: 50px; 
            backdrop-filter: blur(10px);
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .val { font-size: 5rem; font-weight: bold; margin: 20px 0; }
        .nano-label { font-size: 1.5rem; opacity: 0.8; margin-top: -10px; margin-bottom: 30px; }
        
        button { background: white; color: #6a5acd; border: none; padding: 20px; border-radius: 15px; font-weight: bold; width: 100%; font-size: 18px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        
        #v-cont { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:black; z-index: 1000; }
        video { width: 100%; height: 80%; object-fit: cover; }
    </style>
</head>
<body>

    <div class="box">
        <h2 style="letter-spacing: 2px;">SOLDE WALLET</h2>
        <div class="val" id="s">...</div>
        <div class="nano-label">NANO</div>
        <button onclick="startS()">📷 SCANNER POUR PAYER</button>
    </div>

    <p style="margin-top: 30px; opacity: 0.6;">Compte : Noah</p>

    <div id="v-cont">
        <video id="video"></video>
        <button onclick="stopS()" style="background:red; color:white; width:100%; height:20%; font-size: 20px;">ANNULER</button>
    </div>

<script>
    const U = "https://mitepoyvwxfrffwqgyxb.supabase.co/rest/v1";
    const K = "Sb_publishable_uCSvxjc-yJIULaaAMJcNpg_J2zwiect";
    const rd = new ZXing.BrowserMultiFormatReader();

    async function sync() {
        try {
            const r = await fetch(`${U}/cards?name=eq.Noah`, { headers: { "apikey": K } });
            const d = await r.json();
            if(d[0]) document.getElementById('s').innerText = Math.floor(d[0].balance);
        } catch(e) { console.log("Erreur sync"); }
    }

    function startS() {
        document.getElementById('v-cont').style.display = 'block';
        rd.decodeFromVideoDevice(null, 'video', (res) => {
            if(res) {
                stopS();
                alert("Paiement scanné ! Code : " + res.text);
            }
        });
    }

    function stopS() { rd.reset(); document.getElementById('v-cont').style.display = 'none'; }

    // Sync toutes le 2 secondes pour voir le solde descendre après un achat
    sync();
    setInterval(sync, 2000);
</script>
</body>
</html>
