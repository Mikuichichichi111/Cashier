<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mon Wallet - Scanner QR</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #6a5acd; color: white; margin: 0; padding: 20px; }
        #reader { width: 100%; max-width: 350px; margin: auto; border-radius: 20px; overflow: hidden; border: 3px solid white; }
        .card { background: white; color: #333; padding: 20px; border-radius: 20px; margin-top: 20px; }
        .btn-pay { width: 100%; padding: 18px; background: #2ecc71; color: white; border: none; border-radius: 15px; font-weight: bold; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>💳 Scanner QR Payment</h2>
    <div id="reader"></div>

    <div class="card">
        <h3 id="info">Scannez le QR Code</h3>
        <p id="amount">0 N</p>
        <button class="btn-pay" onclick="payer()">CONFIRMER PAIEMENT</button>
    </div>

<script>
    const URL = "https://mitepoyvwxfrffwqgyxb.supabase.co/rest/v1";
    const KEY = "Sb_publishable_uCSvxjc-yJIULaaAMJcNpg_J2zwiect";
    let montantScan = 0;

    const qrScanner = new Html5Qrcode("reader");
    // On force le format QR_CODE ici
    qrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250, formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ] }, 
    async (decodedText) => {
        montantScan = parseFloat(decodedText);
        document.getElementById('info').innerText = "Montant détecté";
        document.getElementById('amount').innerText = montantScan + " Nano";
    });

    async function payer() {
        // Logique de mise à jour du solde utilisateur via PATCH...
        alert("Paiement de " + montantScan + " envoyé !");
    }
</script>
</body>
</html>
