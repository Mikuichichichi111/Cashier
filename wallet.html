<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Nano Wallet Sync</title>
    <style>
        body { font-family: sans-serif; background: #6a5acd; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .box { padding: 40px; border: 4px solid white; border-radius: 40px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        .money { font-size: 80px; font-weight: bold; margin: 20px 0; }
        a { color: white; text-decoration: none; font-weight: bold; border: 2px solid white; padding: 10px 20px; border-radius: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>SOLDE PARTAGÉ</h2>
        <div class="money" id="solde">...</div>
        <a href="caisse.html">RETOUR CAISSE</a>
    </div>

<script>
    const URL = "https://mitepoyvwxfrffwqgyxb.supabase.co/rest/v1";
    const KEY = "Sb_publishable_uCSvxjc-yJIULaaAMJcNpg_J2zwiect";

    async function update() {
        const res = await fetch(`${URL}/wallet_commun?id=eq.1`, { headers: { "apikey": KEY } });
        const data = await res.json();
        document.getElementById('solde').innerText = Math.floor(data[0].solde) + " N";
    }
    update();
    setInterval(update, 2000); // Mise à jour auto toutes les 2 secondes
</script>
</body>
</html>
