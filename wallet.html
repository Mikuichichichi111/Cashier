<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noah Wallet</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        body { font-family: sans-serif; background: #6a5acd; color: white; text-align: center; margin: 0; padding: 20px; }
        .box { background: rgba(255,255,255,0.1); border: 2px solid white; padding: 30px; border-radius: 30px; margin-top: 50px; backdrop-filter: blur(10px); }
        .val { font-size: 4rem; font-weight: bold; margin: 20px 0; }
        button { background: white; color: #6a5acd; border: none; padding: 15px; border-radius: 15px; font-weight: bold; width: 100%; font-size: 18px; cursor: pointer; }
        #v-cont { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:black; }
        video { width: 100%; height: 80%; object-fit: cover; }
    </style>
</head>
<body>
    <div class="box">
        <h2>SOLDE ACTUEL</h2>
        <div class="val"><span id="s">...</span> N</div>
        <button onclick="startS()">📷 SCANNER UN PAIEMENT</button>
    </div>
    <div id="v-cont">
        <video id="video"></video>
        <button onclick="stopS()" style="background:red; color:white; width:100%; height:20%;">ANNULER</button>
    </div>
<script>
    const U = "https://mitepoyvwxfrffwqgyxb.supabase.co/rest/v1", K = "Sb_publishable_uCSvxjc-yJIULaaAMJcNpg_J2zwiect";
    const rd = new ZXing.BrowserMultiFormatReader();
    async function sync() {
        const r = await fetch(`${U}/cards?name=eq.Noah`, { headers: { "apikey": K } });
        const d = await r.json();
        if(d[0]) document.getElementById('s').innerText = d[0].balance;
    }
    function startS() {
        document.getElementById('v-cont').style.display='block';
        rd.decodeFromVideoDevice(null, 'video', (res) => {
            if(res) { stopS(); alert("Code scanné : " + res.text); }
        });
    }
    function stopS() { rd.reset(); document.getElementById('v-cont').style.display='none'; }
    sync();
    setInterval(sync, 2000);
</script>
</body>
</html>
